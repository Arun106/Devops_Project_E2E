apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-e2e-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Arun106/Devops_Project_E2E.git
    targetRevision: main
    path: platform/helm/app
    helm:
      releaseName: devops-e2e-app
  destination:
    server: https://kubernetes.default.svc
    namespace: showcase
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
